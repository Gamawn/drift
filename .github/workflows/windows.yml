# Builds Drift for Windows as an installer and a portable zip: drift.exe, the
# Qt it needs, and the mpv and yt-dlp it drives, side by side so nothing else
# has to be installed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake CONFIG-=debug_and_release ..\drift.pro
          nmake

      - name: Bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "dist/Drift"
          New-Item -ItemType Directory $dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter drift.exe | Select-Object -First 1
          Copy-Item $exe.FullName $dist
          windeployqt --release --no-translations --qmldir src "$dist/drift.exe"

          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$dist/yt-dlp.exe"
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-x86_64-2*.7z' --dir mpv
          7z x (Get-ChildItem mpv/*.7z | Select-Object -First 1).FullName -ompv/x
          Copy-Item mpv/x/mpv.exe $dist

          Copy-Item LICENSE, README.md $dist
          Compress-Archive $dist Drift-windows-x64.zip

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          $version = (Select-String -Path pkgbuild/PKGBUILD -Pattern '^pkgver=(.+)$').Matches[0].Groups[1].Value
          & $iscc.FullName "/DAppVersion=$version" windows/drift.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Drift-windows-x64
          path: |
            Drift-setup-x64.exe
            Drift-windows-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Drift-setup-x64.exe
            Drift-windows-x64.zip

  # The Arch package, the same one bin/install builds, for Omarchy machines.
  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          pacman -Syu --noconfirm --needed qt6-base qt6-declarative
          useradd -m builder
          chown -R builder .
          # makepkg refuses to run as root; runtime depends (mpv, yt-dlp) aren't needed to build.
          su builder -c 'cd pkgbuild && makepkg -f --nodeps --noconfirm'

      - uses: actions/upload-artifact@v4
        with:
          name: drift-arch-x86_64
          path: pkgbuild/drift-[0-9]*.pkg.tar.zst

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkgbuild/drift-[0-9]*.pkg.tar.zst
