# Builds Drift for Windows as an installer and a portable zip: drift.exe, the
# Qt it needs, and the mpv and yt-dlp it drives, side by side so nothing else
# has to be installed.
name: Release

on:
  push:
    # master too: a tag run can only restore caches saved on the default branch,
    # so without it every release downloads Qt again.
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Drift's updater compares the tag with the version built into drift.exe;
      # a release that still carries the old one would be offered to itself forever.
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkgver = (Select-String -Path pkgbuild/PKGBUILD -Pattern '^pkgver=(.+)$').Matches[0].Groups[1].Value
          $app = (Select-String -Path src/main.cpp -Pattern 'setApplicationVersion\("(.+)"\)').Matches[0].Groups[1].Value
          if ("v$pkgver" -ne $env:GITHUB_REF_NAME -or $app -ne $pkgver) {
            throw "Tag $env:GITHUB_REF_NAME, pkgver $pkgver and setApplicationVersion $app don't match."
          }

      - uses: ilammy/msvc-dev-cmd@v1

      # Plain cache + aqt instead of install-qt-action, which pip-installs aqt even on a cache hit.
      - id: qt-cache
        uses: actions/cache@v4
        with:
          path: Qt
          key: qt-6.8.3-win64_msvc2022_64-base-declarative-svg

      - if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only the archives Drift links or deploys; skips Designer, Linguist, translations and software OpenGL.
      - if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir Qt --archives qtbase qtdeclarative qtsvg

      - run: echo "$env:GITHUB_WORKSPACE\Qt\6.8.3\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake CONFIG-=debug_and_release ..\drift.pro
          rem nmake runs one job; /MP lets cl compile each batch of sources on every core.
          set CL=/MP
          nmake

      - name: Bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "dist/Drift"
          New-Item -ItemType Directory $dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter drift.exe | Select-Object -First 1
          Copy-Item $exe.FullName $dist
          # Drift draws with the software renderer, so no GPU shader compilers or software OpenGL.
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler --qmldir src "$dist/drift.exe"
          # windeployqt ships every Controls style; Drift only uses Material, built on Basic.
          Remove-Item -Recurse "$dist/qmltooling", "$dist/qml/QtQuick/NativeStyle"
          'FluentWinUI3', 'Fusion', 'Imagine', 'Universal', 'Windows' | ForEach-Object {
            Remove-Item -Recurse "$dist/qml/QtQuick/Controls/$_", "$dist/Qt6QuickControls2$_*.dll"
          }

          # Main.qml failing to load (a missing module) makes drift.exe exit with 1 right away.
          $env:QT_FORCE_STDERR_LOGGING = 1
          $p = Start-Process "$dist/drift.exe" -PassThru -RedirectStandardError drift.log
          Start-Sleep 5
          Get-Content drift.log
          if ($p.HasExited) { exit 1 }
          Stop-Process $p

          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$dist/yt-dlp.exe"
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-x86_64-2*.7z' --dir mpv
          7z e (Get-ChildItem mpv/*.7z | Select-Object -First 1).FullName "-o$dist" mpv.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          Copy-Item LICENSE, README.md $dist
          # 7z is several times faster than Compress-Archive.
          7z a -tzip Drift-windows-x64.zip "./$dist"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Installer
        shell: pwsh
        run: |
          # The runner image usually has Inno Setup already; choco is the fallback.
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = & $find
          }
          $version = (Select-String -Path pkgbuild/PKGBUILD -Pattern '^pkgver=(.+)$').Matches[0].Groups[1].Value
          & $iscc.FullName "/DAppVersion=$version" windows/drift.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Drift-windows-x64
          # Both files are already compressed.
          compression-level: 0
          path: |
            Drift-setup-x64.exe
            Drift-windows-x64.zip

  # The Arch package, the same one bin/install builds, for Omarchy machines.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          pacman -Syu --noconfirm --needed qt6-base qt6-declarative
          useradd -m builder
          chown -R builder .
          # makepkg refuses to run as root; runtime depends (mpv, yt-dlp) aren't needed to build.
          su builder -c 'cd pkgbuild && makepkg -f --nodeps --noconfirm'

      - uses: actions/upload-artifact@v4
        with:
          name: drift-arch-x86_64
          path: pkgbuild/drift-[0-9]*.pkg.tar.zst

  # One publish after both builds, so the parallel jobs don't race to create the release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
