# Builds a portable Windows zip: drift.exe, the Qt it needs, and the mpv and
# yt-dlp it drives, side by side so nothing else has to be installed.
name: Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake CONFIG-=debug_and_release ..\drift.pro
          nmake

      - name: Bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "dist/Drift"
          New-Item -ItemType Directory $dist | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter drift.exe | Select-Object -First 1
          Copy-Item $exe.FullName $dist
          windeployqt --release --no-translations --qmldir src "$dist/drift.exe"

          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$dist/yt-dlp.exe"
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-x86_64-2*.7z' --dir mpv
          7z x (Get-ChildItem mpv/*.7z | Select-Object -First 1).FullName -ompv/x
          Copy-Item mpv/x/mpv.exe $dist

          Copy-Item LICENSE, README.md $dist
          Compress-Archive $dist Drift-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Drift-windows-x64
          path: Drift-windows-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Drift-windows-x64.zip
